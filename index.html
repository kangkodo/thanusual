<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>평소보다</title>
  <meta name="description" content="서울 121곳, 지금 붐비는 곳부터.">
  <link rel="preload" href="./vendor/geist/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <a class="skip" id="skip" href="#board">장소 목록으로</a>
    <div class="rail" id="rail">
      <button type="button" class="sheet-handle" id="sheet-handle" aria-expanded="false" aria-controls="board">
        <span class="sheet-grip" aria-hidden="true"></span>
        지금 붐비는 곳부터
      </button>
      <header class="masthead">
        <h1 class="identity">평소보다</h1>
        <p class="stamp" id="stamp" role="status">불러오는 중</p>
      </header>
      <main id="main">
        <form class="place-search" id="place-search" role="search">
          <label class="sr-only" for="q">장소 이름</label>
          <input id="q" type="search" name="q" placeholder="장소 이름" autocomplete="off" enterkeyhint="search">
        </form>
        <p class="note" id="banner" hidden></p>
        <nav class="tabs" id="tabs" aria-label="장소 분류"></nav>
        <ol class="board" id="board"></ol>
      </main>
      <footer class="foot">
        <p class="sources">서울 열린데이터광장 · <a href="https://github.com/kangkodo/thanusual">소스</a></p>
      </footer>
    </div>
    <div class="map-shell">
      <div class="layer-stack">
        <form class="layers" id="layers" aria-label="지도 레이어"></form>
        <p class="layer-note" id="layer-note" hidden></p>
      </div>
      <p class="map-status" id="map-status" role="status" hidden></p>
      <div id="map" tabindex="-1"></div>
    </div>
  </div>
  <script defer src="./vendor/leaflet/leaflet.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
