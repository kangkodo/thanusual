<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>평소보다</title>
  <meta name="description" content="서울 121곳이 지금, 그리고 평소보다 얼마나 붐비는지 한 지도에서.">
  <meta property="og:title" content="평소보다">
  <meta property="og:description" content="서울 121곳이 지금, 그리고 평소보다 얼마나 붐비는지 한 지도에서.">
  <meta property="og:url" content="https://thanusual.pages.dev/">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#fff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="./vendor/geist/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <a class="skip" id="skip" href="#board">장소 목록으로</a>
    <a class="skip" href="#layers">지도 레이어로</a>
    <div class="rail" id="rail">
      <button type="button" class="sheet-handle" id="sheet-handle" aria-label="장소 목록" aria-expanded="false" aria-controls="board" aria-describedby="sheet-summary sheet-stamp">
        <span class="sheet-grip" aria-hidden="true"></span>
        <span class="sheet-summary" id="sheet-summary">지금 붐비는 곳부터</span>
        <span class="sheet-stamp" id="sheet-stamp"></span>
      </button>
      <header class="masthead">
        <h1 class="identity">평소보다</h1>
        <p class="stamp" id="stamp">불러오는 중</p>
      </header>
      <main id="main">
        <form class="place-search" id="place-search" role="search">
          <label class="sr-only" for="q">장소 이름</label>
          <input id="q" type="search" name="q" placeholder="장소 이름" autocomplete="off" enterkeyhint="search">
        </form>
        <section id="place-detail" class="place-detail" aria-label="선택한 장소" hidden></section>
        <p class="note" id="banner" hidden></p>
        <nav class="tabs" id="tabs" aria-label="장소 분류"></nav>
        <div class="board-scroll">
          <section id="pinned" aria-labelledby="pinned-title" hidden>
            <h2 id="pinned-title">고정한 장소</h2>
            <ul class="board pinned-list" id="pinned-list"></ul>
          </section>
          <ol class="board" id="board"></ol>
        </div>
      </main>
      <footer class="foot">
        <details class="sources"><summary>데이터 출처와 한계</summary><p><a href="https://data.seoul.go.kr/dataVisual/seoul/guide.do">서울시 · KT/SKT 인구 추정</a> · <a href="https://data.seoul.go.kr/dataList/OA-22784/S/1/datasetView.do">서울시 250m 내국인 생활인구(공공누리 1유형)</a> · <a href="https://sgis.kostat.go.kr/">SGIS 행정동 경계</a> · CARTO/OSM 지도. 장소 점은 구역 대표 위치이며 골목별 밀집도가 아닙니다. 250m 칸은 서울시 격자 경계입니다. 과거는 자체 수집분, 예측은 서울시 제공값입니다.</p><a href="https://github.com/kangkodo/thanusual">소스</a></details>
      </footer>
    </div>
    <div class="map-shell">
      <div class="layer-stack">
        <details class="layer-menu"><summary>지도 레이어</summary><form class="layers" id="layers" aria-label="지도 레이어"></form></details>
        <p class="layer-note" id="layer-note" hidden></p>
      </div>
      <section class="time-panel" aria-label="지도 시간 비교">
        <label for="time-mode">지도 보기</label>
        <select id="time-mode"><option value="now">최근 집계</option><option value="history">지난 48시간</option><option value="forecast">시간별 예측</option><option value="usual">평소 대비</option><option value="grid">250m 상세 분포</option></select>
        <label id="compare-label" hidden><input id="time-compare" type="checkbox"> 최근 집계와 차이</label>
        <input id="time-slider" type="range" min="0" max="0" value="0" aria-label="지도에 표시할 시각" hidden>
        <p id="time-note" role="status"></p>
      </section>
      <p class="map-status" id="map-status" role="status" hidden></p>
      <div id="map" tabindex="-1"></div>
    </div>
  </div>
  <script defer src="./vendor/leaflet/leaflet.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
